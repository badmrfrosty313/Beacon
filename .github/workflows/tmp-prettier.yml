name: tmp-prettier
on:
  push:
    branches: ['tmp/prettier-diff']
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src package.json
      - run: git --no-pager diff
