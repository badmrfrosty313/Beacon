# Dependency vulnerability scan (informational; failures are reported, not hidden).
name: Dependency audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit (all dependencies, build tooling)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
