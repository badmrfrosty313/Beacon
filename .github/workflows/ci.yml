name: CI

# Windows is the first supported target, so the full check runs there. Only GitHub-owned
# actions are used, to keep the supply chain small (see SECURITY.md).
#
# Each check is its own step and later steps use `!cancelled()`, so one failure does not hide
# the others and a single run reports everything that is broken.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Windows runner image ships stable Rust with rustfmt and clippy.
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      # Switch to `npm ci` once package-lock.json is committed (and commit Cargo.lock too).
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prettier
        id: prettier
        if: ${{ !cancelled() }}
        run: |
          npx prettier --version
          npm run format:check

      # Diagnostic only: shows what Prettier would change so a failure is actionable from the log.
      - name: Prettier diff (only when the check failed)
        if: ${{ !cancelled() && steps.prettier.outcome == 'failure' }}
        run: |
          npx prettier --write .
          git --no-pager diff

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Vitest
        if: ${{ !cancelled() }}
        run: npm test

      # Rebuilds the packaged Scripture files from the pinned official ZIP and fails if the
      # committed files differ (also re-checks the ZIP hash, the 70-file manifest and totals).
      - name: Verify packaged Scripture data
        if: ${{ !cancelled() }}
        run: npm run scripture:verify

      - name: Rust format
        if: ${{ !cancelled() }}
        run: npm run rust:fmt

      - name: Rust tests
        if: ${{ !cancelled() }}
        run: npm run rust:test

      - name: Clippy
        if: ${{ !cancelled() }}
        run: npm run rust:lint

      - name: Build the desktop binary (no installer)
        if: ${{ !cancelled() }}
        run: npm run tauri build -- --no-bundle

      # The desktop app reads Scripture natively in Rust; the 4 MB browser-demo copy must not
      # be duplicated into its web bundle.
      - name: Desktop web bundle does not contain the browser-demo Scripture copy
        if: ${{ success() }}
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Path dist -Recurse -File | Select-String -SimpleMatch -Pattern "In the beginning, God created the heavens"
          if ($hits) { throw "Scripture text found in the desktop web bundle: $($hits.Path -join ', ')" }

      # A no-installer test executable. This stores its SQLite DB in the normal
      # per-user app data folder; it is not a portable-data or signed release.
      # Upload only trusted main-branch builds, never unreviewed PR binaries.
      - name: Prepare Windows test download and SHA-256
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/beacon.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected Windows binary not found: $exe"
          }
          $sha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  beacon.exe" | Set-Content -Path "src-tauri/target/release/SHA256SUMS.txt" -Encoding ascii

      - name: Upload unsigned Windows test executable
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: beacon-windows-test
          path: |
            src-tauri/target/release/beacon.exe
            src-tauri/target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
