# TEMPORARY helper: generates package-lock.json and src-tauri/Cargo.lock and commits them to the
# feature branch. Delete this workflow (and branch tmp/lockfiles) once the lockfiles exist.
name: Generate lockfiles
on:
  push:
    branches: [tmp/lockfiles]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/first-light-completion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write .
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply CI Prettier formatting" || exit 0
          git push origin HEAD:feature/first-light-completion
